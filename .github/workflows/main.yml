name: FogWindowBeats Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install groq google-auth-oauthlib google-api-python-client requests pillow

      - name: Restaurar token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > token.pickle

      - name: Ejecutar pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/pipeline.py