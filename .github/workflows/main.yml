name: FogWindowBeats Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install groq google-auth-oauthlib google-api-python-client requests pillow

      - name: Instalar FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Restaurar token
        run: echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > token.pickle

      - name: Descargar videos Pexels HD
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PYEOF'
          import requests, os, random, time, shutil
          from pathlib import Path

          API_KEY = os.environ["PEXELS_API_KEY"]
          HEADERS = {"Authorization": API_KEY}

          QUERIES_BY_FOLDER = {
              "assets/videos_lofi": [
                  "rain window night dark",
                  "rain falling on glass window",
                  "rain drops window close up",
                  "dark rainy night window",
                  "cozy room rain outside",
              ],
              "assets/videos_lluvia": [
                  "heavy rain falling street",
                  "rain storm window",
                  "rain drops glass close",
                  "rainy day window view",
                  "rain puddle drops",
              ],
              "assets/videos_naturaleza": [
                  "forest rain nature",
                  "river flowing nature",
                  "waterfall nature peaceful",
                  "nature rain trees",
                  "ocean waves calm",
              ],
          }

          QUERIES_VERTICAL = [
              "rain window vertical",
              "rain falling vertical slow",
              "nature rain vertical",
              "forest rain vertical",
              "rain drops vertical close",
          ]

          def get_best_url(video_files, orientation):
              if orientation == "landscape":
                  preferred = [f for f in video_files
                               if f.get("width", 0) >= 1920
                               and f.get("height", 0) <= 1080
                               and f.get("file_type") == "video/mp4"]
                  if not preferred:
                      preferred = [f for f in video_files
                                   if f.get("width", 0) >= 1280
                                   and f.get("file_type") == "video/mp4"]
              else:
                  preferred = [f for f in video_files
                               if f.get("height", 0) >= 1920
                               and f.get("width", 0) <= 1080
                               and f.get("file_type") == "video/mp4"]
                  if not preferred:
                      preferred = [f for f in video_files
                                   if f.get("height", 0) >= f.get("width", 1)
                                   and f.get("file_type") == "video/mp4"]
              if not preferred:
                  preferred = [f for f in video_files if f.get("file_type") == "video/mp4"]
              preferred.sort(key=lambda x: x.get("width", 0) * x.get("height", 0), reverse=True)
              return preferred[0]["link"] if preferred else None

          def download_video(url, out_path):
              try:
                  resp = requests.get(url, stream=True, timeout=90)
                  resp.raise_for_status()
                  total = 0
                  with open(out_path, "wb") as f:
                      for chunk in resp.iter_content(chunk_size=1024*1024):
                          f.write(chunk)
                          total += len(chunk)
                  size_mb = total / (1024*1024)
                  if size_mb < 1.0:
                      os.remove(out_path)
                      print(f"  Descartado (muy pequeño {size_mb:.1f}MB)")
                      return False
                  print(f"  OK {size_mb:.1f}MB → {out_path}")
                  return True
              except Exception as e:
                  print(f"  Error: {e}")
                  if os.path.exists(out_path):
                      os.remove(out_path)
                  return False

          def fetch_videos(queries, folder, orientation, target=5):
              Path(folder).mkdir(parents=True, exist_ok=True)
              downloaded = 0
              random.shuffle(queries)
              for query in queries:
                  if downloaded >= target:
                      break
                  print(f"Buscando '{query}' ({orientation})...")
                  try:
                      r = requests.get(
                          "https://api.pexels.com/videos/search",
                          headers=HEADERS,
                          params={
                              "query": query,
                              "per_page": 10,
                              "orientation": orientation,
                              "size": "large",
                              "min_duration": 5,
                              "max_duration": 60,
                          },
                          timeout=30
                      )
                      r.raise_for_status()
                      videos = r.json().get("videos", [])
                      print(f"  Encontrados: {len(videos)}")
                      random.shuffle(videos)
                      for v in videos:
                          if downloaded >= target:
                              break
                          if v.get("duration", 0) < 5:
                              continue
                          url = get_best_url(v.get("video_files", []), orientation)
                          if not url:
                              continue
                          out = f"{folder}/pexels_{v['id']}.mp4"
                          if Path(out).exists():
                              downloaded += 1
                              continue
                          if download_video(url, out):
                              downloaded += 1
                      time.sleep(0.5)
                  except Exception as e:
                      print(f"  Error query '{query}': {e}")
                      time.sleep(2)
              print(f"Total {orientation} en {folder}: {downloaded}")
              return downloaded

          total_h = 0
          for folder, queries in QUERIES_BY_FOLDER.items():
              n = fetch_videos(queries, folder, "landscape", target=4)
              total_h += n

          total_v = fetch_videos(QUERIES_VERTICAL, "assets/videos_vertical", "portrait", target=5)

          if total_h == 0:
              raise Exception("No se descargaron videos horizontales")
          if total_v == 0:
              raise Exception("No se descargaron videos verticales")

          print(f"=== Total: {total_h} horizontales, {total_v} verticales ===")
          PYEOF

      - name: Preparar assets audio
        run: |
          for dir in assets/audio_lofi assets/audio_lluvia assets/audio_naturaleza assets/audio_jazz assets/audio_piano; do
            mkdir -p $dir
            cp assets/audio_small/* $dir/ 2>/dev/null || true
          done

      - name: Ejecutar pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/pipeline.py