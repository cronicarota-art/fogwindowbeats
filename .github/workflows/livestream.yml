name: FogWindowBeats LiveStream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'

jobs:
  livestream:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install groq google-auth-oauthlib google-api-python-client requests pillow

      - name: Instalar FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Restaurar token
        run: echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > token.pickle

      - name: Descargar videos Pexels
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PYEOF'
          import requests, os, random, time, subprocess
          from pathlib import Path

          API_KEY = os.environ["PEXELS_API_KEY"]
          HEADERS = {"Authorization": API_KEY}

          QUERIES = [
              "rain drops window glass night",
              "rain falling window close up",
              "cozy room lamp night rain",
              "rain street night city",
              "forest rain nature calm",
              "coffee shop rain window",
              "rain window dark night close",
              "heavy rain window blur night",
          ]

          def get_best_url(video_files):
              preferred = [f for f in video_files
                           if f.get("width",0) >= 1920 and f.get("height",0) <= 1080
                           and f.get("file_type") == "video/mp4"]
              if not preferred:
                  preferred = [f for f in video_files
                               if f.get("width",0) >= 1280
                               and f.get("file_type") == "video/mp4"]
              if not preferred:
                  preferred = [f for f in video_files if f.get("file_type") == "video/mp4"]
              preferred.sort(key=lambda x: x.get("width",0)*x.get("height",0), reverse=True)
              return preferred[0]["link"] if preferred else None

          def download_and_normalize(url, out_path):
              tmp = out_path.with_suffix(".tmp.mp4")
              try:
                  resp = requests.get(url, stream=True, timeout=90)
                  resp.raise_for_status()
                  total = 0
                  with open(tmp, "wb") as f:
                      for chunk in resp.iter_content(chunk_size=1024*1024):
                          f.write(chunk)
                          total += len(chunk)
                  if total < 1024*1024:
                      tmp.unlink(missing_ok=True)
                      return False
                  vf = "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24,format=yuv420p"
                  r = subprocess.run([
                      "ffmpeg", "-y", "-i", str(tmp),
                      "-vf", vf, "-r", "24", "-vsync", "cfr",
                      "-c:v", "libx264", "-preset", "fast", "-crf", "26",
                      "-an", str(out_path)
                  ], capture_output=True)
                  tmp.unlink(missing_ok=True)
                  if r.returncode != 0 or not out_path.exists():
                      return False
                  print(f"  OK -> {out_path.name}")
                  return True
              except Exception as e:
                  print(f"  Error: {e}")
                  for p in [tmp, out_path]:
                      if p.exists(): p.unlink(missing_ok=True)
                  return False

          Path("assets/live_videos").mkdir(parents=True, exist_ok=True)
          downloaded = 0
          random.shuffle(QUERIES)
          for query in QUERIES:
              if downloaded >= 8:
                  break
              print(f"Buscando: '{query}'")
              try:
                  r = requests.get(
                      "https://api.pexels.com/videos/search",
                      headers=HEADERS,
                      params={"query": query, "per_page": 5,
                              "orientation": "landscape", "size": "large",
                              "min_duration": 10},
                      timeout=30
                  )
                  r.raise_for_status()
                  videos = r.json().get("videos", [])
                  random.shuffle(videos)
                  for v in videos:
                      if downloaded >= 8:
                          break
                      url = get_best_url(v.get("video_files", []))
                      if not url:
                          continue
                      out = Path(f"assets/live_videos/pexels_{v['id']}.mp4")
                      if out.exists():
                          downloaded += 1
                          continue
                      if download_and_normalize(url, out):
                          downloaded += 1
                  time.sleep(0.5)
              except Exception as e:
                  print(f"  Error: {e}")
          print(f"Total videos live: {downloaded}")
          if downloaded == 0:
              raise Exception("Sin videos para livestream")
          PYEOF

      - name: Preparar audio
        run: |
          mkdir -p assets/audio_lofi
          cp assets/audio_small/* assets/audio_lofi/ 2>/dev/null || true

      - name: Generar thumbnail livestream
        run: |
          python - <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import random
          from pathlib import Path

          TEMAS = [
              ((10,20,50),  (30,80,180),  (80,200,255), "Lluvia + Lofi EN VIVO"),
              ((20,20,60),  (80,40,180),  (40,180,220), "Lofi para Estudiar EN VIVO"),
              ((10,30,15),  (20,120,50),  (80,220,100), "Naturaleza + Lofi EN VIVO"),
              ((15,10,40),  (60,20,120),  (140,60,200), "Lofi para Dormir EN VIVO"),
          ]
          bg, c1, c2, label = random.choice(TEMAS)
          img = Image.new("RGB", (1280,720), color=bg)
          draw = ImageDraw.Draw(img)
          draw.ellipse([(-100,-100),(600,600)], fill=c1)
          draw.ellipse([(700,200),(1400,900)], fill=c2)
          overlay = Image.new("RGBA", (1280,720), (0,0,0,120))
          img = Image.alpha_composite(img.convert("RGBA"), overlay).convert("RGB")
          draw = ImageDraw.Draw(img)
          try:
              font_big = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 80)
              font_med = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 50)
              font_small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 36)
          except:
              font_big = ImageFont.load_default()
              font_med = font_big
              font_small = font_big
          draw.rectangle([(0,0),(1280,80)], fill=(0,0,0))
          draw.text((640,40), "FogWindowBeats", font=font_med, fill=(200,210,255), anchor="mm")
          draw.ellipse([(540,250),(740,350)], fill=(255,0,0))
          draw.text((640,300), "EN VIVO", font=font_med, fill=(255,255,255), anchor="mm")
          draw.text((640,430), label, font=font_big, fill=(255,255,255), anchor="mm",
                    stroke_width=3, stroke_fill=(0,0,0))
          draw.rectangle([(0,640),(1280,720)], fill=(0,0,0))
          draw.text((640,680), "24/7 Musica Lofi Continua - Suscribete!", font=font_small,
                    fill=(180,200,255), anchor="mm")
          Path("assets").mkdir(exist_ok=True)
          img.save("assets/live_thumbnail.jpg", "JPEG", quality=95)
          print(f"Thumbnail generado: {label}")
          PYEOF

      - name: Crear broadcast y configurar live
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os, pickle, random, requests, json
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.auth.transport.requests import Request
          from groq import Groq

          TELEGRAM_TOKEN = os.environ["TELEGRAM_TOKEN"]
          TELEGRAM_CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]
          GROQ_API_KEY = os.environ["GROQ_API_KEY"]

          def send_telegram(msg):
              try:
                  requests.post(
                      f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage",
                      data={"chat_id": TELEGRAM_CHAT_ID, "text": msg},
                      timeout=10
                  )
              except:
                  pass

          client = Groq(api_key=GROQ_API_KEY)
          TEMAS = [
              "lluvia en ventana de noche para estudiar",
              "lofi con lluvia para concentrarse",
              "lluvia relajante para trabajar",
              "lofi nocturno con lluvia para dormir",
              "lluvia y lofi para madrugada productiva"
          ]
          tema = random.choice(TEMAS)

          prompt = f"""Genera metadata VIRAL para livestream de YouTube de musica lofi con lluvia, tema: "{tema}".
JSON con:
- titulo: max 80 chars, viral, incluye LIVE o EN VIVO o 24/7, ejemplo: "LIVE: Lluvia + Lofi 24/7 para Estudiar y Concentrarse"
- descripcion: 300 palabras emotiva con beneficios del lofi y call to action suscribirse, hashtags al final
- comentario_inicio: mensaje motivador corto para publicar al inicio del live, max 150 chars
"""
          r = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[{"role": "user", "content": prompt}],
              response_format={"type": "json_object"},
              max_tokens=1000
          )
          meta = json.loads(r.choices[0].message.content, strict=False)

          with open("token.pickle", "rb") as f:
              creds = pickle.load(f)
          if creds.expired and creds.refresh_token:
              creds.refresh(Request())
          service = build("youtube", "v3", credentials=creds)

          titulo = meta["titulo"].encode("ascii","ignore").decode()
          descripcion = meta["descripcion"].encode("ascii","ignore").decode()
          comentario = meta.get("comentario_inicio","Bienvenidos! Suscribete para mas lofi todos los dias.").encode("ascii","ignore").decode()

          broadcast = service.liveBroadcasts().insert(
              part="snippet,status,contentDetails",
              body={
                  "snippet": {
                      "title": titulo,
                      "description": descripcion,
                      "scheduledStartTime": "2026-01-01T00:00:00Z"
                  },
                  "status": {
                      "privacyStatus": "public",
                      "selfDeclaredMadeForKids": False
                  },
                  "contentDetails": {
                      "enableAutoStart": True,
                      "enableAutoStop": True,
                      "latencyPreference": "normal"
                  }
              }
          ).execute()
          broadcast_id = broadcast["id"]

          streams = service.liveStreams().list(part="id,snippet", mine=True).execute()
          stream_id = None
          for s in streams.get("items", []):
              stream_id = s["id"]
              break

          if not stream_id:
              stream = service.liveStreams().insert(
                  part="snippet,cdn",
                  body={
                      "snippet": {"title": "FogWindowBeats Stream"},
                      "cdn": {"frameRate": "24fps", "ingestionType": "rtmp", "resolution": "1080p"}
                  }
              ).execute()
              stream_id = stream["id"]

          service.liveBroadcasts().bind(
              part="id,contentDetails",
              id=broadcast_id,
              streamId=stream_id
          ).execute()

          try:
              service.thumbnails().set(
                  videoId=broadcast_id,
                  media_body=MediaFileUpload("assets/live_thumbnail.jpg", mimetype="image/jpeg")
              ).execute()
              print("Thumbnail aplicado al broadcast")
          except Exception as e:
              print(f"Error thumbnail: {e}")

          with open("broadcast_id.txt", "w") as f:
              f.write(broadcast_id)
          with open("live_comment.txt", "w") as f:
              f.write(comentario)

          send_telegram(f"LIVE iniciando\n{titulo}\nhttps://youtu.be/{broadcast_id}")
          print(f"Broadcast: {broadcast_id} | Titulo: {titulo}")
          PYEOF

      - name: Iniciar livestream 11 horas
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          find assets/live_videos -name "*.mp4" | sort > live_video_list.txt
          find assets/audio_lofi -name "*.mp3" | sort > live_audio_list.txt
          while IFS= read -r f; do echo "file '$f'"; done < live_video_list.txt > live_video_concat.txt
          while IFS= read -r f; do echo "file '$f'"; done < live_audio_list.txt > live_audio_concat.txt
          ffmpeg \
            -stream_loop -1 -f concat -safe 0 -i live_video_concat.txt \
            -stream_loop -1 -f concat -safe 0 -i live_audio_concat.txt \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=24,format=yuv420p,drawtext=text=FogWindowBeats:fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:fontsize=38:fontcolor=white@0.65:x=(w-text_w)/2:y=25:shadowcolor=black@0.6:shadowx=2:shadowy=2" \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -r 24 -g 48 -keyint_min 48 \
            -c:a aac -b:a 128k -ar 44100 \
            -t 19800 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}" &
          FFMPEG_PID=$!
          sleep 45
          python - <<'PYEOF'
          import pickle, os
          from googleapiclient.discovery import build
          from google.auth.transport.requests import Request
          with open("token.pickle","rb") as f:
              creds = pickle.load(f)
          if creds.expired and creds.refresh_token:
              creds.refresh(Request())
          service = build("youtube","v3",credentials=creds)
          with open("broadcast_id.txt") as f:
              broadcast_id = f.read().strip()
          with open("live_comment.txt") as f:
              comentario = f.read().strip()
          try:
              service.commentThreads().insert(
                  part="snippet",
                  body={"snippet":{"videoId":broadcast_id,"topLevelComment":{"snippet":{"textOriginal":comentario}}}}
              ).execute()
              print(f"Comentario publicado: {comentario}")
          except Exception as e:
              print(f"Error comentario: {e}")
          PYEOF
          wait $FFMPEG_PID